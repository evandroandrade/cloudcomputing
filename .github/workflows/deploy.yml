name: Deploy para HostGator

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup lftp
        run: sudo apt-get install -y lftp

      - name: Upload arquivos raiz
        env:
          FTP_HOST: ftp.evandroandrade.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
            cd /public_html/cloudcomputing;
            put index.html;
            put admin.html;
            put admin-login.html;
            put styles.css;
            put script.js;
            put favicon.ico;
            put browserconfig.xml;
            put manifest.json;
            mput *.png;
            quit
          "

      - name: Upload pasta js/
        env:
          FTP_HOST: ftp.evandroandrade.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
            cd /public_html/cloudcomputing/js;
            put js/security.js -o security.js;
            put js/secure-auth.js -o secure-auth.js;
            quit
          "

      - name: Upload pasta config/
        env:
          FTP_HOST: ftp.evandroandrade.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
            cd /public_html/cloudcomputing/config;
            put config/supabase.js -o supabase.js;
            put config/exercicios.json -o exercicios.json;
            quit
          "
