name: Deploy para HostGator

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Descobrir estrutura FTP e fazer deploy
        env:
          FTP_HOST: ftp.evandroandrade.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import ftplib
          import os

          HOST = os.environ['FTP_HOST']
          USER = os.environ['FTP_USER']
          PASS = os.environ['FTP_PASS']

          ftp = ftplib.FTP(HOST)
          ftp.login(USER, PASS)
          ftp.set_pasv(True)

          # Descobrir diretorio raiz
          print(f"Diretorio atual: {ftp.pwd()}")
          print("Listando raiz FTP:")
          ftp.retrlines('LIST')

          print("\nListando public_html:")
          try:
              ftp.cwd('/public_html')
              ftp.retrlines('LIST')
          except Exception as e:
              print(f"Erro: {e}")

          print("\nListando cloudcomputing:")
          try:
              ftp.cwd('/public_html/cloudcomputing')
              ftp.retrlines('LIST')
          except Exception as e:
              print(f"Erro: {e}")

          # Verificar se index.html tem o tamanho correto
          try:
              size = ftp.size('index.html')
              print(f"\nindex.html no servidor: {size} bytes")
              print(f"index.html local: {os.path.getsize('index.html')} bytes")
          except Exception as e:
              print(f"Erro ao verificar tamanho: {e}")

          ftp.quit()
          PYEOF
