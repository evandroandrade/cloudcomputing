name: Deploy para HostGator

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via Python FTP
        env:
          FTP_HOST: ftp.evandroandrade.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import ftplib
          import os
          import sys

          HOST = os.environ['FTP_HOST']
          USER = os.environ['FTP_USER']
          PASS = os.environ['FTP_PASS']
          REMOTE_BASE = 'evandroandrade.com/cloudcomputing'

          files = [
              ('index.html',             f'{REMOTE_BASE}/index.html'),
              ('admin.html',             f'{REMOTE_BASE}/admin.html'),
              ('admin-login.html',       f'{REMOTE_BASE}/admin-login.html'),
              ('styles.css',             f'{REMOTE_BASE}/styles.css'),
              ('script.js',              f'{REMOTE_BASE}/script.js'),
              ('manifest.json',          f'{REMOTE_BASE}/manifest.json'),
              ('.htaccess',              f'{REMOTE_BASE}/.htaccess'),
              ('favicon.ico',            f'{REMOTE_BASE}/favicon.ico'),
              ('browserconfig.xml',      f'{REMOTE_BASE}/browserconfig.xml'),
              ('js/security.js',         f'{REMOTE_BASE}/js/security.js'),
              ('js/secure-auth.js',      f'{REMOTE_BASE}/js/secure-auth.js'),
              ('config/supabase.js',     f'{REMOTE_BASE}/config/supabase.js'),
              ('config/exercicios.json', f'{REMOTE_BASE}/config/exercicios.json'),
          ]

          for f in os.listdir('.'):
              if f.endswith('.png'):
                  files.append((f, f'{REMOTE_BASE}/{f}'))

          print(f'Conectando em {HOST}...')
          ftp = ftplib.FTP(HOST)
          ftp.login(USER, PASS)
          ftp.set_pasv(True)
          print('Conectado!')

          ok = 0
          erros = 0

          for local, remote in files:
              if not os.path.exists(local):
                  print(f'SKIP: {local}')
                  continue
              try:
                  remote_dir = '/'.join(remote.split('/')[:-1])
                  remote_file = remote.split('/')[-1]
                  
                  # Sempre voltar para raiz e ir ao diretorio correto
                  ftp.cwd('/')
                  try:
                      ftp.cwd(remote_dir)
                  except:
                      # Criar diretorios pai recursivamente
                      parts = remote_dir.strip('/').split('/')
                      current = ''
                      for part in parts:
                          current = current + '/' + part
                          try:
                              ftp.cwd(current)
                          except:
                              ftp.mkd(current)
                              ftp.cwd(current)

                  with open(local, 'rb') as f:
                      ftp.storbinary(f'STOR {remote_file}', f)

                  size = os.path.getsize(local)
                  print(f'OK ({size} bytes): {local}')
                  ok += 1
              except Exception as e:
                  print(f'ERRO: {local} -> {e}')
                  erros += 1

          ftp.quit()
          print(f'\n=== {ok} OK, {erros} erros ===')
          if erros > 0:
              sys.exit(1)
          PYEOF
