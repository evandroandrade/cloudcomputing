name: Deploy para HostGator

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup lftp
        run: sudo apt-get install -y lftp

      - name: Upload todos os arquivos
        env:
          FTP_HOST: ftp.evandroandrade.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" << EOF
          set ftp:ssl-allow no
          set net:timeout 60
          set net:max-retries 5

          cd /public_html/cloudcomputing
          echo "Conectado - iniciando upload"

          put index.html
          put admin.html
          put admin-login.html
          put styles.css
          put script.js
          put manifest.json
          put .htaccess
          put favicon.ico
          put browserconfig.xml
          mput *.png

          echo "Subindo pasta js/"
          cd js
          put ../js/security.js -o security.js
          put ../js/secure-auth.js -o secure-auth.js
          cd ..

          echo "Subindo pasta config/"
          cd config
          put ../config/supabase.js -o supabase.js
          put ../config/exercicios.json -o exercicios.json
          cd ..

          echo "Upload concluido!"
          quit
          EOF
