name: Deploy para HostGator

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup lftp
        run: sudo apt-get install -y lftp

      - name: Upload arquivos raiz
        env:
          FTP_HOST: ftp.evandroandrade.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" << EOF
          set ftp:ssl-allow no
          set net:timeout 60
          cd /public_html/cloudcomputing
          put index.html
          put admin.html
          put admin-login.html
          put styles.css
          put script.js
          put manifest.json
          put .htaccess
          put favicon.ico
          put browserconfig.xml
          mput *.png
          echo "Raiz OK"
          quit
          EOF

      - name: Upload pasta js/
        env:
          FTP_HOST: ftp.evandroandrade.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          cd js
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" << EOF
          set ftp:ssl-allow no
          set net:timeout 60
          cd /public_html/cloudcomputing/js
          put security.js
          put secure-auth.js
          echo "js/ OK"
          quit
          EOF

      - name: Upload pasta config/
        env:
          FTP_HOST: ftp.evandroandrade.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          cd config
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" << EOF
          set ftp:ssl-allow no
          set net:timeout 60
          cd /public_html/cloudcomputing/config
          put supabase.js
          put exercicios.json
          echo "config/ OK"
          quit
          EOF
