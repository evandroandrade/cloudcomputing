name: Deploy para HostGator

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via LFTP para HostGator
        env:
          FTP_HOST: ftp.evandroandrade.com
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 3;
            open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
            mirror --reverse --delete --verbose \
              --exclude-glob .git \
              --exclude-glob .github \
              --exclude-glob node_modules \
              --exclude-glob migrations \
              --exclude-glob scripts \
              --exclude-glob supabase \
              --exclude-glob '*.bat' \
              --exclude-glob '*.md' \
              --exclude-glob 'teste-*.html' \
              --exclude-glob 'test-*.html' \
              --exclude-glob 'package*.json' \
              --exclude-glob '.env*' \
              . /public_html/cloudcomputing;
            quit
          "
