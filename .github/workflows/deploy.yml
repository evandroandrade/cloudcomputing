name: Deploy para HostGator

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via FTP — força upload total
        uses: kevinpainchaud/simple-ftp-deploy-action@v1.2.1
        with:
          ftp_host: ftp.evandroandrade.com
          ftp_username: ${{ secrets.FTP_USERNAME }}
          ftp_password: ${{ secrets.FTP_PASSWORD }}
          local_source_dir: "."
          dist_target_dir: "/public_html/cloudcomputing"
          delete: "true"
          exclude: "^(.git|node_modules|migrations|scripts|supabase|\.env|.*\.bat|MIGRACAO_AUTH\.md|teste-.*\.html|test-.*\.html|.*\.md|package.*\.json)$"
